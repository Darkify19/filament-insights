name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Tests (Filament ${{ matrix.filament }})
    runs-on: ubuntu-latest

    # One codebase for every supported Filament line. Filament 3 and 4 run on Livewire 3,
    # Filament 5 on Livewire 4, so each row pins its own pair.
    strategy:
      fail-fast: false
      matrix:
        include:
          - filament: '^3.3.53'
            livewire: '^3.5'
            testbench: '^10.0'
          - filament: '^5.8.2'
            livewire: '^4.0'
            testbench: '^11.0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: intl
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: |
          composer require --no-update --no-interaction "filament/filament:${{ matrix.filament }}"
          composer require --dev --no-update --no-interaction \
            "livewire/livewire:${{ matrix.livewire }}" \
            "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Lint PHP syntax
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run tests
        run: vendor/bin/pest --compact
